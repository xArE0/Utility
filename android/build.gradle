allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force "androidx.core:core-ktx:1.13.1"
            force "androidx.core:core:1.13.1"
            force "androidx.glance:glance-appwidget:1.1.1"
            force "androidx.glance:glance:1.1.1"
            force "androidx.compose.remote:remote-creation-android:1.0.0-alpha02"
        }
    }
}

rootProject.buildDir = "../build"
def rootProjectPath = rootProject.projectDir.canonicalPath
subprojects {
    def subprojectPath = project.projectDir.canonicalPath
    if (subprojectPath.startsWith(rootProjectPath)) {
        project.buildDir = "${rootProject.buildDir}/${project.name}"
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    def configureAndroid = {
        if (project.hasProperty('android')) {
            project.android {
                compileSdk = 36
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                if (project.android.hasProperty('kotlinOptions')) {
                    kotlinOptions {
                        jvmTarget = '17'
                    }
                }
            }
        }
    }
    if (project.state.executed) {
        configureAndroid()
    } else {
        project.afterEvaluate {
            configureAndroid()
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
