plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android Gradle plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

static def getBuildDate() {
    def date = new Date()
    def sdf = new java.text.SimpleDateFormat("yy.MM.dd")
    return sdf.format(date)
}

task generateAppVersion {
    doLast {
        def buildDate = getBuildDate()
        def appVersionFile = new File("../../lib/core/app_version.dart")
        def content = """const int appRevision = 1;
const String buildDate = '$buildDate';

String get appVersion => '\$buildDate.v\$appRevision';
"""
        appVersionFile.text = content
        println("✓ Generated app_version.dart with build date: $buildDate")
    }
}

// Release signing key. key.properties and the keystore are git-ignored; back them up, since an
// update signed with a different key won't install over the existing app.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { keystoreProperties.load(it) }
}

android {
    namespace = "com.example.utility"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.utility"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Falls back to the debug key on a machine without key.properties.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn("key.properties not found: signing release build with the debug key")
                signingConfig = signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

// Run generateAppVersion before building
tasks.whenTaskAdded { task ->
    if (task.name == 'preBuild') {
        task.dependsOn generateAppVersion
    }
}

configurations.all {
    resolutionStrategy {
        force "androidx.core:core-ktx:1.13.1"
        force "androidx.core:core:1.13.1"
        force "androidx.glance:glance-appwidget:1.1.1"
        force "androidx.glance:glance:1.1.1"
        force "androidx.compose.remote:remote-creation-android:1.0.0-alpha02"
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
}
